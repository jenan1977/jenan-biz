<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="جميع مقالات جنان بيز">
    <title>قائمة المقالات - جنان بيز</title>
    <link rel="stylesheet" href="../css/blog.css">
    <link rel="stylesheet" href="../css/main.css">
</head>
<body>
    <header class="blog-header">
        <div class="container header-content">
            <a href="blog.html" class="logo-link"><h1>جنان بيز</h1></a>
            <nav class="blog-nav">
                <a href="blog.html">الرئيسية</a>
                <a href="blog-admin.html">لوحة التحكم</a>
                <a href="../index.html">الموقع الرئيسي</a>
            </nav>
        </div>
    </header>

    <main class="container blog-main">
        <div class="list-header">
            <h2>جميع المقالات</h2>
            <div class="list-controls">
                <input type="text" id="search-input" placeholder="بحث..." class="search-input" aria-label="بحث">
                <select id="category-filter" class="filter-select" aria-label="تصفية حسب الفئة">
                    <option value="">جميع الفئات</option>
                </select>
                <select id="sort-filter" class="filter-select" aria-label="الترتيب">
                    <option value="newest">الأحدث</option>
                    <option value="popular">الأكثر مشاهدة</option>
                    <option value="liked">الأكثر إعجاباً</option>
                </select>
            </div>
        </div>

        <div class="tags-bar" id="tags-bar"></div>

        <div class="articles-list" id="articles-list">
            <div class="loading-spinner">جارٍ التحميل...</div>
        </div>

        <div class="pagination" id="pagination"></div>
    </main>

    <footer class="blog-footer">
        <div class="container">
            <p>© 2026 جنان بيز - جميع الحقوق محفوظة</p>
        </div>
    </footer>

    <script src="../js/blog-api.js"></script>
    <script src="../js/blog-renderer.js"></script>
    <script src="../js/search-widget.js"></script>
    <script>
        let currentPage = 1;
        const perPage = 10;

        async function loadPage(page = 1) {
            const search = document.getElementById('search-input').value;
            const category = document.getElementById('category-filter').value;
            await loadArticlesList({ page, per_page: perPage, search, category });
            currentPage = page;
        }

        (async function init() {
            await loadCategoryOptions('category-filter');
            await loadTags();
            await loadPage(1);
        })();
    </script>
</body>
</html>
