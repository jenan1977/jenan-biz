<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Analytics – Jenan Biz</title>
    <link rel="stylesheet" href="../css/main.css" />
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f6fa;
            margin: 0;
            padding: 0;
        }
        .analytics-container {
            max-width: 960px;
            margin: 2rem auto;
            padding: 0 1rem;
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 0.5rem;
        }
        .filter-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
            margin-bottom: 1.5rem;
            align-items: flex-end;
        }
        .filter-bar label {
            display: flex;
            flex-direction: column;
            font-size: 0.85rem;
            color: #555;
        }
        .filter-bar input,
        .filter-bar button {
            margin-top: 0.25rem;
            padding: 0.45rem 0.75rem;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 0.95rem;
        }
        .filter-bar button {
            background: #2980b9;
            color: #fff;
            border-color: #2980b9;
            cursor: pointer;
        }
        .filter-bar button:hover {
            background: #1f6692;
        }
        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 1.5rem;
        }
        .card {
            background: #fff;
            border-radius: 8px;
            padding: 1.25rem;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
        }
        .card h3 {
            margin: 0 0 0.5rem;
            font-size: 0.85rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .card .value {
            font-size: 1.7rem;
            font-weight: 700;
            color: #2c3e50;
        }
        .section {
            background: #fff;
            border-radius: 8px;
            padding: 1.25rem;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
            margin-bottom: 1rem;
        }
        .section h2 {
            margin: 0 0 0.75rem;
            font-size: 1rem;
            color: #2c3e50;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }
        th, td {
            text-align: left;
            padding: 0.5rem 0.75rem;
            border-bottom: 1px solid #eee;
        }
        th {
            color: #888;
            font-weight: 600;
        }
        .alert-badge {
            background: #e74c3c;
            color: #fff;
            border-radius: 4px;
            padding: 0.15rem 0.5rem;
            font-size: 0.8rem;
        }
        #status-msg {
            padding: 0.75rem 1rem;
            border-radius: 6px;
            margin-bottom: 1rem;
            display: none;
        }
        #status-msg.info  { background: #d6eaf8; color: #1a5276; display: block; }
        #status-msg.error { background: #fdedec; color: #922b21; display: block; }
        #status-msg.success { display: none; }
        .spinner {
            display: inline-block;
            width: 1em; height: 1em;
            border: 3px solid #cce;
            border-top-color: #2980b9;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            vertical-align: middle;
            margin-right: 0.5em;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
<div class="analytics-container">
    <h1>📊 Business Analytics</h1>

    <div class="filter-bar">
        <label>
            Company ID
            <input type="text" id="company-id" placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx" />
        </label>
        <label>
            From
            <input type="date" id="from-date" />
        </label>
        <label>
            To
            <input type="date" id="to-date" />
        </label>
        <label>
            JWT Token
            <input type="password" id="jwt-token" placeholder="Bearer token" />
        </label>
        <button id="load-btn" onclick="loadAnalytics()">Load Analytics</button>
    </div>

    <div id="status-msg"></div>

    <div class="cards">
        <div class="card">
            <h3>Total Sales</h3>
            <div class="value" id="total-sales">—</div>
        </div>
        <div class="card">
            <h3>Total Purchases</h3>
            <div class="value" id="total-purchases">—</div>
        </div>
        <div class="card">
            <h3>Low-Stock Alerts</h3>
            <div class="value" id="low-stock-count">—</div>
        </div>
        <div class="card">
            <h3>Top Customers</h3>
            <div class="value" id="top-customers-count">—</div>
        </div>
    </div>

    <div class="section">
        <h2>🏆 Top Customers</h2>
        <table id="top-customers-table">
            <thead><tr><th>#</th><th>Customer</th><th>Total Spent</th></tr></thead>
            <tbody id="top-customers-body">
                <tr><td colspan="3" style="color:#aaa">No data loaded yet.</td></tr>
            </tbody>
        </table>
    </div>

    <div class="section">
        <h2>⚠️ Low-Stock Alerts</h2>
        <table id="low-stock-table">
            <thead><tr><th>Product</th><th>Available</th><th>Status</th></tr></thead>
            <tbody id="low-stock-body">
                <tr><td colspan="3" style="color:#aaa">No data loaded yet.</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script src="../js/analytics.js"></script>
</body>
</html>
