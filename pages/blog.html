<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="مدونة جنان بيز - مقالات في الأعمال والمال والاستثمار">
    <meta property="og:title" content="مدونة جنان بيز">
    <meta property="og:description" content="أحدث المقالات في عالم الأعمال والمال والاستثمار">
    <meta property="og:type" content="website">
    <title>مدونة جنان بيز</title>
    <link rel="stylesheet" href="../css/blog.css">
    <link rel="stylesheet" href="../css/main.css">
</head>
<body>
    <header class="blog-header">
        <div class="container header-content">
            <div class="logo-section">
                <a href="../index.html" class="logo-link">
                    <h1>جنان بيز</h1>
                    <span class="tagline">رحلتك نحو المال والنجاح</span>
                </a>
            </div>
            <nav class="blog-nav">
                <a href="blog-list.html">جميع المقالات</a>
                <a href="blog-admin.html">لوحة التحكم</a>
                <a href="../index.html">الرئيسية</a>
            </nav>
        </div>
    </header>

    <main class="blog-main">
        <!-- Hero Section -->
        <section class="blog-hero">
            <div class="container">
                <h2>مدونة جنان بيز</h2>
                <p>أفكار عملية وخطط قابلة للتطبيق في عالم الأعمال والاستثمار</p>
                <div class="hero-search">
                    <input type="text" id="hero-search" placeholder="ابحث في المقالات..." aria-label="بحث">
                    <button onclick="searchArticles()" aria-label="بحث">🔍</button>
                </div>
            </div>
        </section>

        <!-- Categories Filter -->
        <section class="categories-section container">
            <div class="categories-chips" id="categories-chips">
                <button class="chip active" data-category="">الكل</button>
            </div>
        </section>

        <!-- Featured Article -->
        <section class="featured-section container" id="featured-section" style="display:none">
            <h3 class="section-title">المقالة المميزة</h3>
            <div id="featured-article"></div>
        </section>

        <!-- Latest Articles Grid -->
        <section class="articles-section container">
            <h3 class="section-title">أحدث المقالات</h3>
            <div class="articles-grid" id="articles-grid">
                <div class="loading-spinner">جارٍ التحميل...</div>
            </div>
            <div class="pagination" id="pagination"></div>
        </section>
    </main>

    <footer class="blog-footer">
        <div class="container">
            <p>© 2026 جنان بيز - جميع الحقوق محفوظة</p>
        </div>
    </footer>

    <script src="../js/blog-api.js"></script>
    <script src="../js/blog-renderer.js"></script>
    <script src="../js/search-widget.js"></script>
    <script>
        (async function init() {
            await loadCategories();
            await loadArticles({ page: 1, per_page: 9 });
        })();
    </script>
</body>
</html>
