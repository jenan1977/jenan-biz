<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفاصيل المقال - جنان بيز</title>
    <link rel="stylesheet" href="../blog/assets/blog.css">
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f8f9fa; color: #333; }
        .page-header { background: linear-gradient(135deg, #1a1a2e, #16213e); color: #fff; padding: 1.5rem 2rem; display: flex; align-items: center; gap: 1rem; }
        .page-header a { color: #aaa; text-decoration: none; font-size: .9rem; }
        .page-header a:hover { color: #fff; }
        .article-container { max-width: 860px; margin: 2rem auto; padding: 0 1rem; }
        .article-header { background: #fff; border-radius: 12px; padding: 2rem; margin-bottom: 1.5rem; box-shadow: 0 2px 10px rgba(0,0,0,.06); }
        .article-meta { display: flex; flex-wrap: wrap; gap: .5rem; margin-bottom: 1rem; font-size: .85rem; }
        .badge { padding: .25rem .7rem; border-radius: 12px; background: #e0e7ff; color: #4338ca; }
        .badge.published { background: #d1fae5; color: #065f46; }
        .badge.draft { background: #fef3c7; color: #92400e; }
        h1 { font-size: 2rem; margin: 0 0 1rem; line-height: 1.3; }
        .article-summary { color: #555; font-size: 1.05rem; line-height: 1.6; border-right: 4px solid #e94560; padding-right: 1rem; margin-bottom: 1rem; }
        .article-info { display: flex; gap: 1.5rem; flex-wrap: wrap; font-size: .85rem; color: #777; }
        .article-cover { width: 100%; max-height: 400px; object-fit: cover; border-radius: 12px; margin-bottom: 1.5rem; }
        .article-body { background: #fff; border-radius: 12px; padding: 2rem; margin-bottom: 1.5rem; box-shadow: 0 2px 10px rgba(0,0,0,.06); line-height: 1.8; }
        .article-body h2, .article-body h3 { margin-top: 1.5rem; color: #1a1a2e; }
        .article-body pre { background: #f3f4f6; padding: 1rem; border-radius: 8px; overflow-x: auto; }
        .article-body code { background: #f3f4f6; padding: .1rem .3rem; border-radius: 4px; font-size: .9em; }
        .article-body blockquote { border-right: 4px solid #e94560; padding-right: 1rem; color: #555; margin: 1rem 0; }
        .actions-bar { display: flex; gap: 1rem; flex-wrap: wrap; align-items: center; margin-bottom: 1.5rem; }
        .btn { padding: .6rem 1.2rem; border-radius: 8px; border: none; cursor: pointer; font-size: .9rem; text-decoration: none; display: inline-flex; align-items: center; gap: .4rem; }
        .btn-primary { background: #e94560; color: #fff; }
        .btn-secondary { background: #6366f1; color: #fff; }
        .btn-outline { background: transparent; border: 1px solid #ccc; color: #555; }
        .btn:hover { opacity: .9; }
        .ai-panel { background: #fff; border-radius: 12px; padding: 1.5rem; margin-bottom: 1.5rem; box-shadow: 0 2px 10px rgba(0,0,0,.06); }
        .ai-panel h3 { margin: 0 0 1rem; color: #1a1a2e; }
        .ai-result { background: #f8faff; border: 1px solid #e0e7ff; border-radius: 8px; padding: 1rem; margin-top: 1rem; white-space: pre-wrap; direction: auto; }
        .rating-section { background: #fff; border-radius: 12px; padding: 1.5rem; margin-bottom: 1.5rem; box-shadow: 0 2px 10px rgba(0,0,0,.06); }
        .stars { display: flex; gap: .4rem; font-size: 2rem; cursor: pointer; }
        .star { color: #ddd; transition: color .2s; }
        .star.filled, .star:hover, .star.hover { color: #f59e0b; }
        .comments-section { background: #fff; border-radius: 12px; padding: 1.5rem; box-shadow: 0 2px 10px rgba(0,0,0,.06); }
        .comment-card { border-bottom: 1px solid #f0f0f0; padding: .8rem 0; }
        .comment-card:last-child { border-bottom: none; }
        .comment-author { font-weight: 600; margin-bottom: .3rem; }
        .comment-body { color: #555; line-height: 1.5; }
        .comment-form { margin-top: 1.5rem; }
        .comment-form input, .comment-form textarea { width: 100%; padding: .8rem; border: 1px solid #ddd; border-radius: 8px; font-size: .95rem; margin-bottom: .8rem; font-family: inherit; box-sizing: border-box; }
        .comment-form textarea { min-height: 100px; resize: vertical; }
        .loading { text-align: center; padding: 3rem; font-size: 1.2rem; }
    </style>
</head>
<body>
    <div class="page-header">
        <a href="blog-list.html">← قائمة المقالات</a>
        <span style="color:#555;">|</span>
        <span id="breadcrumb-title" style="color:#ccc;font-size:.9rem;"></span>
    </div>

    <div id="loading" class="loading">⏳ جاري التحميل...</div>
    <div id="article-container" class="article-container" style="display:none;">
        <div class="article-header">
            <div class="article-meta" id="article-meta"></div>
            <h1 id="article-title"></h1>
            <p class="article-summary" id="article-summary"></p>
            <div class="article-info" id="article-info"></div>
        </div>

        <img id="article-cover" class="article-cover" style="display:none;" alt="">

        <div class="actions-bar">
            <a id="edit-btn" href="#" class="btn btn-outline">✏️ تعديل</a>
            <button class="btn btn-secondary" onclick="generateSummary()">🤖 ملخص ذكي</button>
            <button class="btn btn-outline" onclick="translateArticle()">🌐 ترجمة</button>
        </div>

        <div class="article-body" id="article-body"></div>

        <div class="ai-panel" id="ai-panel" style="display:none;">
            <h3 id="ai-panel-title">نتيجة الذكاء الاصطناعي</h3>
            <div class="ai-result" id="ai-result"></div>
        </div>

        <div class="rating-section">
            <h3>⭐ قيّم هذا المقال</h3>
            <div class="stars" id="stars-container">
                <span class="star" data-score="1">★</span>
                <span class="star" data-score="2">★</span>
                <span class="star" data-score="3">★</span>
                <span class="star" data-score="4">★</span>
                <span class="star" data-score="5">★</span>
            </div>
            <p id="rating-summary" style="margin-top:.5rem;color:#777;font-size:.9rem;"></p>
        </div>

        <div class="comments-section">
            <h3>💬 التعليقات</h3>
            <div id="comments-list"></div>
            <div class="comment-form">
                <h4>أضف تعليقاً</h4>
                <input type="text" id="comment-name" placeholder="اسمك *">
                <input type="email" id="comment-email" placeholder="بريدك الإلكتروني (اختياري)">
                <textarea id="comment-body" placeholder="تعليقك *"></textarea>
                <button class="btn btn-primary" onclick="submitComment()">💬 إرسال التعليق</button>
            </div>
        </div>
    </div>

    <script src="../js/blog-api.js"></script>
    <script src="../js/blog-renderer.js"></script>
    <script>
        let articleId = null;
        const sessionKey = 'sess_' + Math.random().toString(36).substr(2, 12);

        async function loadArticle() {
            const params = new URLSearchParams(window.location.search);
            const idOrSlug = params.get('id') || params.get('slug');
            if (!idOrSlug) { document.getElementById('loading').textContent = '❌ لم يتم تحديد مقال.'; return; }

            try {
                const article = await BlogAPI.getArticle(idOrSlug);
                articleId = article.id;
                renderArticle(article);
                loadRatingSummary();
                loadComments();
            } catch (e) {
                document.getElementById('loading').textContent = '❌ تعذّر تحميل المقال.';
            }
        }

        function renderArticle(article) {
            document.title = article.title + ' - جنان بيز';
            document.getElementById('breadcrumb-title').textContent = article.title;
            document.getElementById('article-title').textContent = article.title;
            document.getElementById('article-summary').textContent = article.summary || '';
            document.getElementById('article-summary').style.display = article.summary ? 'block' : 'none';

            const metaDiv = document.getElementById('article-meta');
            const statusClass = article.status === 'published' ? 'published' : 'draft';
            const statusLabel = article.status === 'published' ? 'منشور' : 'مسودة';
            metaDiv.innerHTML = `<span class="badge ${statusClass}">${statusLabel}</span>
                ${article.category ? `<span class="badge">${article.category.name}</span>` : ''}
                ${(article.tags || []).map(t => `<span class="badge">${t.name}</span>`).join('')}`;

            document.getElementById('article-info').innerHTML = `
                <span>👤 ${article.author || 'مجهول'}</span>
                <span>👁️ ${article.view_count} مشاهدة</span>
                ${article.read_time_minutes ? `<span>⏱️ ${article.read_time_minutes} دقائق</span>` : ''}
                <span>📅 ${new Date(article.created_at).toLocaleDateString('ar')}</span>`;

            if (article.cover_image_url) {
                const img = document.getElementById('article-cover');
                img.src = article.cover_image_url;
                img.style.display = 'block';
            }

            document.getElementById('article-body').innerHTML = BlogRenderer.renderMarkdown(article.body);
            document.getElementById('edit-btn').href = 'write-article.html?id=' + article.id;

            document.getElementById('loading').style.display = 'none';
            document.getElementById('article-container').style.display = 'block';
        }

        async function loadRatingSummary() {
            if (!articleId) return;
            const summary = await BlogAPI.getRatingSummary(articleId);
            document.getElementById('rating-summary').textContent =
                `التقييم الحالي: ${summary.average}/5 (${summary.count} تقييم)`;
        }

        async function loadComments() {
            if (!articleId) return;
            const comments = await BlogAPI.getComments(articleId);
            const list = document.getElementById('comments-list');
            if (!comments.length) { list.innerHTML = '<p style="color:#999">لا توجد تعليقات بعد.</p>'; return; }
            list.innerHTML = comments.map(c => `
                <div class="comment-card">
                    <div class="comment-author">👤 ${c.author_name}</div>
                    <div class="comment-body">${c.body}</div>
                    <div style="font-size:.8rem;color:#aaa;margin-top:.3rem;">
                        ${new Date(c.created_at).toLocaleDateString('ar')}
                    </div>
                </div>`).join('');
        }

        async function submitComment() {
            const name = document.getElementById('comment-name').value.trim();
            const body = document.getElementById('comment-body').value.trim();
            if (!name || !body) { alert('الاسم والتعليق مطلوبان'); return; }
            const email = document.getElementById('comment-email').value.trim();
            try {
                await BlogAPI.addComment(articleId, { author_name: name, author_email: email || null, body });
                alert('✅ تم إرسال تعليقك وهو قيد المراجعة.');
                document.getElementById('comment-name').value = '';
                document.getElementById('comment-email').value = '';
                document.getElementById('comment-body').value = '';
            } catch (e) { alert('❌ تعذّر إرسال التعليق.'); }
        }

        async function generateSummary() {
            if (!articleId) return;
            const panel = document.getElementById('ai-panel');
            const result = document.getElementById('ai-result');
            panel.style.display = 'block';
            document.getElementById('ai-panel-title').textContent = '🤖 الملخص الذكي';
            result.textContent = '⏳ جاري توليد الملخص...';
            try {
                const data = await BlogAPI.aiSummary(articleId);
                result.textContent = data.result;
            } catch (e) { result.textContent = '❌ ' + e.message; }
        }

        async function translateArticle() {
            const lang = prompt('أدخل رمز اللغة المستهدفة (مثال: en, fr, de):', 'en');
            if (!lang) return;
            const panel = document.getElementById('ai-panel');
            const result = document.getElementById('ai-result');
            panel.style.display = 'block';
            document.getElementById('ai-panel-title').textContent = '🌐 الترجمة';
            result.textContent = '⏳ جاري الترجمة...';
            try {
                const data = await BlogAPI.aiTranslate(articleId, lang);
                result.textContent = data.result;
            } catch (e) { result.textContent = '❌ ' + e.message; }
        }

        // Stars rating
        document.querySelectorAll('.star').forEach(star => {
            star.addEventListener('click', async () => {
                const score = parseInt(star.dataset.score);
                try {
                    await BlogAPI.rateArticle(articleId, { session_key: sessionKey, score });
                    document.querySelectorAll('.star').forEach((s, i) => {
                        s.classList.toggle('filled', i < score);
                    });
                    await loadRatingSummary();
                } catch (e) { console.error(e); }
            });
            star.addEventListener('mouseenter', () => {
                const score = parseInt(star.dataset.score);
                document.querySelectorAll('.star').forEach((s, i) => s.classList.toggle('hover', i < score));
            });
            star.addEventListener('mouseleave', () => {
                document.querySelectorAll('.star').forEach(s => s.classList.remove('hover'));
            });
        });

        loadArticle();
    </script>
</body>
</html>
