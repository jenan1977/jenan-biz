version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: jenan_biz_db
    environment:
      POSTGRES_USER: jenan
      POSTGRES_PASSWORD: jenanpass
      POSTGRES_DB: jenan_biz
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jenan -d jenan_biz"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jenan_biz_backend
    environment:
      DATABASE_URL: postgresql://jenan:jenanpass@db:5432/jenan_biz
      SECRET_KEY: change-this-secret-key-in-production
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: jenan_biz_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  uploads_data:
