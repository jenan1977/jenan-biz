<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Main Page</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>AI Chatbot Header</h1>
    </header>
    
    <section id="smart-search">
        <h2>Smart Search</h2>
        <input type="text" placeholder="Search...">
    </section>

    <section id="category-filters">
        <h2>Category Filters</h2>
        <button>Category 1</button>
        <button>Category 2</button>
        <button>Category 3</button>
    </section>

    <section id="articles-grid">
        <h2>Articles</h2>
        <div class="article">
            <h3>Article Title 1</h3>
            <p>Article summary goes here.</p>
        </div>
        <div class="article">
            <h3>Article Title 2</h3>
            <p>Article summary goes here.</p>
        </div>
        <div class="article">
            <h3>Article Title 3</h3>
            <p>Article summary goes here.</p>
        </div>
    </section>

    <section id="consultation-form">
        <h2>Consultation Form</h2>
        <form>
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
            <input type="submit" value="Submit">
        </form>
    </section>

    <footer>
        <h2>Chatbot Widget</h2>
        <!-- Placeholder for chatbot widget -->
    </footer>
</body>
</html>
