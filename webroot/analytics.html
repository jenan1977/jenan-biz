<!DOCTYPE html>
<html lang="en" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jenan-Biz – Analytics Dashboard</title>
  <style>
    :root {
      --primary: #2C3E50;
      --accent:  #3498DB;
      --success: #27AE60;
      --danger:  #E74C3C;
      --bg:      #F5F6FA;
      --card:    #FFFFFF;
      --text:    #2C3E50;
      --muted:   #7F8C8D;
      --radius:  8px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Segoe UI", Tahoma, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    header {
      background: var(--primary);
      color: #fff;
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    header h1 { font-size: 1.4rem; }
    .container { max-width: 1200px; margin: 2rem auto; padding: 0 1rem; }

    /* ── Controls ───────────────────────────── */
    .controls {
      background: var(--card);
      border-radius: var(--radius);
      padding: 1.5rem;
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      align-items: flex-end;
      box-shadow: 0 1px 4px rgba(0,0,0,.08);
      margin-bottom: 1.5rem;
    }
    .form-group { display: flex; flex-direction: column; gap: .3rem; }
    .form-group label { font-size: .85rem; color: var(--muted); }
    .form-group input, .form-group select {
      border: 1px solid #ddd;
      border-radius: 4px;
      padding: .45rem .6rem;
      font-size: .95rem;
      color: var(--text);
    }
    button {
      cursor: pointer;
      border: none;
      border-radius: 4px;
      padding: .55rem 1.2rem;
      font-size: .95rem;
      font-weight: 600;
      transition: opacity .15s;
    }
    button:hover { opacity: .85; }
    .btn-primary   { background: var(--accent);  color: #fff; }
    .btn-success   { background: var(--success); color: #fff; }
    .btn-secondary { background: var(--primary); color: #fff; }
    button:disabled { opacity: .5; cursor: not-allowed; }

    /* ── KPI Cards ──────────────────────────── */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    .kpi-card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 1.2rem 1.5rem;
      box-shadow: 0 1px 4px rgba(0,0,0,.08);
    }
    .kpi-card .label { font-size: .8rem; color: var(--muted); margin-bottom: .4rem; }
    .kpi-card .value { font-size: 1.6rem; font-weight: 700; color: var(--primary); }

    /* ── Tables ─────────────────────────────── */
    .section { margin-bottom: 2rem; }
    .section h2 { font-size: 1.1rem; margin-bottom: .8rem; }
    table { width: 100%; border-collapse: collapse; background: var(--card);
            border-radius: var(--radius); overflow: hidden;
            box-shadow: 0 1px 4px rgba(0,0,0,.08); }
    thead th {
      background: var(--primary); color: #fff;
      padding: .6rem .9rem; text-align: start; font-weight: 600; font-size: .88rem;
    }
    tbody tr:nth-child(even) { background: #F9FAFB; }
    tbody td { padding: .55rem .9rem; font-size: .9rem; border-bottom: 1px solid #EEE; }
    tbody tr:last-child td { border-bottom: none; }

    /* ── Status / Toast ─────────────────────── */
    #status-bar {
      position: fixed; top: 1rem; right: 1rem; z-index: 999;
      display: flex; flex-direction: column; gap: .5rem;
    }
    .toast {
      background: var(--primary); color: #fff;
      padding: .7rem 1.2rem; border-radius: var(--radius);
      font-size: .9rem; box-shadow: 0 2px 8px rgba(0,0,0,.2);
      animation: fadeIn .3s ease;
    }
    .toast.error  { background: var(--danger); }
    .toast.success{ background: var(--success); }
    @keyframes fadeIn { from { opacity:0; transform:translateY(-10px); } to { opacity:1; } }

    /* ── Job poller ─────────────────────────── */
    #job-poller {
      background: var(--card); border-radius: var(--radius);
      padding: 1rem 1.5rem; margin-bottom: 1.5rem;
      box-shadow: 0 1px 4px rgba(0,0,0,.08);
      display: none;
    }
    #job-poller p { font-size: .9rem; margin-bottom: .5rem; }
    #job-progress { height: 6px; background: #ddd; border-radius: 3px; overflow: hidden; }
    #job-progress-bar { height: 100%; background: var(--accent); width: 0; transition: width .4s; }
  </style>
</head>
<body>
  <header>
    <h1>📊 Jenan-Biz Analytics</h1>
    <span id="user-info" style="font-size:.85rem;opacity:.8"></span>
  </header>

  <div id="status-bar"></div>

  <div class="container">
    <!-- Controls -->
    <div class="controls">
      <div class="form-group">
        <label for="date-from">من تاريخ</label>
        <input type="date" id="date-from" />
      </div>
      <div class="form-group">
        <label for="date-to">إلى تاريخ</label>
        <input type="date" id="date-to" />
      </div>
      <button class="btn-primary" id="btn-analyze" onclick="Analytics.runAnalysis()">
        🔍 تحليل مالي
      </button>
      <button class="btn-success" id="btn-report" onclick="Analytics.generateReport()">
        📄 تقرير PDF
      </button>
    </div>

    <!-- Job poller -->
    <div id="job-poller">
      <p id="job-status-text">جارٍ المعالجة…</p>
      <div id="job-progress"><div id="job-progress-bar"></div></div>
    </div>

    <!-- KPI cards -->
    <div class="kpi-grid">
      <div class="kpi-card">
        <div class="label">إجمالي المبيعات</div>
        <div class="value" id="kpi-sales">—</div>
      </div>
      <div class="kpi-card">
        <div class="label">إجمالي المشتريات</div>
        <div class="value" id="kpi-purchases">—</div>
      </div>
      <div class="kpi-card">
        <div class="label">تنبيهات المخزون المنخفض</div>
        <div class="value" id="kpi-low-stock">—</div>
      </div>
    </div>

    <!-- Top customers -->
    <div class="section" id="section-customers" style="display:none">
      <h2>🏆 أفضل العملاء</h2>
      <table>
        <thead>
          <tr><th>#</th><th>اسم العميل</th><th>إجمالي الإنفاق</th></tr>
        </thead>
        <tbody id="tbl-customers"></tbody>
      </table>
    </div>

    <!-- Low stock alerts -->
    <div class="section" id="section-lowstock" style="display:none">
      <h2>⚠️ تنبيهات المخزون المنخفض</h2>
      <table>
        <thead>
          <tr><th>معرف المخزون</th><th>الكمية المتاحة</th><th>مستوى إعادة الطلب</th></tr>
        </thead>
        <tbody id="tbl-lowstock"></tbody>
      </table>
    </div>
  </div>

  <script src="/assets/js/analytics.js"></script>
</body>
</html>
