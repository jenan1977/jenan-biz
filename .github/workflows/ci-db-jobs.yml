name: CI – DB init & tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  db-init-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jenan_biz
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/jenan_biz

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-ci.txt

      - name: Initialise database (create all tables)
        run: PYTHONPATH=backend python -c "from app.core.database import init_db; init_db()"

      - name: Verify jobs table exists
        run: |
          PYTHONPATH=backend python - <<'EOF'
          from sqlalchemy import inspect
          from app.core.database import get_engine
          inspector = inspect(get_engine())
          tables = inspector.get_table_names()
          assert "jobs" in tables, f"'jobs' table not found! Tables present: {tables}"
          print(f"OK – 'jobs' table verified. All tables: {tables}")
          EOF

      - name: Run tests
        run: PYTHONPATH=backend pytest backend/tests -v
